name: Windows validation

on:
  workflow_dispatch:
    inputs:
      test_updater:
        description: Install and verify a signed in-app upgrade
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test log pipeline on Windows
        run: cargo test --locked -p waymark-log
      - name: Build desktop app and NSIS installer
        run: npm run tauri -- build --bundles nsis
      - name: Launch Waymark and test live detection
        shell: powershell
        run: ./scripts/windows-smoke.ps1 -Executable ./target/release/waymark.exe
      - name: Save tested build's installer
        uses: actions/upload-artifact@v4
        with:
          name: Waymark-Windows-x64-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Test signed in-app upgrade
        if: inputs.test_updater
        shell: pwsh
        run: ./scripts/windows-updater-smoke.ps1
