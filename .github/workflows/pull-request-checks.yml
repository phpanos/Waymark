name: Pull request checks

on: pull_request

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  rust:
    name: Rust log pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p waymark-log

  windows:
    name: Windows desktop
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build unsigned desktop executable
        run: npm run tauri -- build --ci --no-bundle -- --locked
      - name: Test Rust workspace on Windows
        run: cargo test --locked --workspace --features tauri/custom-protocol
      - name: Test Windows overlay in WebView2
        shell: powershell
        run: ./scripts/windows-smoke.ps1 -Executable ./target/release/waymark.exe
